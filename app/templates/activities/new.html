{% extends "base.html" %}
{% block title %}发布活动 · 校园活动管理系统{% endblock %}
{% block content %}
  <h1>发布活动</h1>
  {% if errors %}
    <div class="flash flash-error">
      {% for e in errors %}<div>{{ e }}</div>{% endfor %}
    </div>
  {% endif %}
  <form method="post" class="card form" style="max-width: 560px;">
    <label>活动主题 *
      <input type="text" name="title" value="{{ form.get('title','') }}" required autofocus>
    </label>
    <label>活动地点 *
      <input type="text" name="location" value="{{ form.get('location','') }}" required>
    </label>
    <div class="form-row">
      <label>活动开始时间 *
        <input type="datetime-local" name="start_time" value="{{ form.get('start_time','') }}" required>
      </label>
      <label>报名截止时间 *
        <input type="datetime-local" name="signup_deadline" value="{{ form.get('signup_deadline','') }}" required>
      </label>
    </div>
    <label>人数上限（留空或 0 = 不限）
      <input type="number" min="0" name="capacity" value="{{ form.get('capacity','') }}" placeholder="0 表示不限人数">
    </label>
    <label>活动介绍 *
      <textarea name="description" rows="5" required>{{ form.get('description','') }}</textarea>
    </label>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">发布活动</button>
      <a class="btn" href="{{ url_for('activities.index') }}">取消</a>
    </div>
  </form>
{% endblock %}
